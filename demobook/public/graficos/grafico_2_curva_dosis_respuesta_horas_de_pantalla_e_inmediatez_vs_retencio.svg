.badge-text {
  font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 13px;
  font-weight: 700;
  fill: #C2F4E7;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.chart-title {
  font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 34px;
  font-weight: 700;
  fill: #FFFFFF;
  letter-spacing: -0.015em;
}

.chart-subtitle {
  font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 17px;
  font-weight: 400;
  fill: #A1A7B8;
}

.axis-label {
  font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px;
  font-weight: 500;
  fill: #D6C8FA;
}

.tick-label {
  font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 14px;
  font-weight: 500;
  fill: #A1A7B8;
  font-feature-settings: "tnum" 1, "zero" 1;
}

.data-label {
  font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 15px;
  font-weight: 700;
  fill: #FFFFFF;
  font-feature-settings: "tnum" 1, "zero" 1;
}

.grid-line {
  stroke: #23293F;
  stroke-width: 1px;
  stroke-dasharray: 4 4;
}

.axis-line {
  stroke: #3B2A68;
  stroke-width: 1.5px;
}

.legend-text {
  font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px;
  font-weight: 500;
  fill: #D6C8FA;
}

.footer-text {
  font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 13px;
  font-weight: 400;
  fill: #707688;
}

.watermark {
  font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 11px;
  font-weight: 600;
  fill: #707688;
  letter-spacing: 0.05em;
}
