<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap');

:root {
  --pz-canvas: #101219;
  --pz-surface: #191B22;
  --pz-elevated: #202538;
  --pz-border: #2E3856;
  --pz-border-subtle: #23293F;
  --pz-grid: #23293F;
  --pz-text-primary: #FFFFFF;
  --pz-text-secondary: #E2E8F0;
  --pz-text-muted: #94A3B8;
  --pz-text-dimmed: #64748B;
  --pz-mint: #6F58A7;
  --pz-blue: #D6C8FA;
  --pz-lilac: #C2F4E7;
  --pz-sol: #5A6271;
  --pz-orange: #00F2FE;
  --pz-coral: #AF892C;
  --pz-cyan: #A14A45;
}

.canvas-bg { fill: #101219; }
.card-surface { fill: #191B22; stroke: #2E3856; stroke-width: 1.5px; rx: 18px; }
.elevated-card { fill: #202538; stroke: #23293F; stroke-width: 1px; rx: 14px; }

.badge-text {
  font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 13px;
  font-weight: 700;
  fill: #6F58A7;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.chart-title {
  font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 34px;
  font-weight: 700;
  fill: #FFFFFF;
  letter-spacing: -0.015em;
}

.chart-subtitle {
  font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 17px;
  font-weight: 400;
  fill: #94A3B8;
}

.axis-label {
  font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px;
  font-weight: 500;
  fill: #E2E8F0;
}

.tick-label {
  font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 14px;
  font-weight: 500;
  fill: #94A3B8;
  font-feature-settings: "tnum" 1, "zero" 1;
}

.data-label {
  font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 15px;
  font-weight: 700;
  fill: #FFFFFF;
  font-feature-settings: "tnum" 1, "zero" 1;
}

.grid-line {
  stroke: #23293F;
  stroke-width: 1px;
  stroke-dasharray: 4 4;
}

.axis-line {
  stroke: #2E3856;
  stroke-width: 1.5px;
}

.legend-text {
  font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 15px;
  font-weight: 500;
  fill: #E2E8F0;
}

.footer-text {
  font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 13px;
  font-weight: 400;
  fill: #64748B;
}

.watermark {
  font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 11px;
  font-weight: 600;
  fill: #64748B;
  letter-spacing: 0.05em;
}
]]></style>
  <g id="background">
