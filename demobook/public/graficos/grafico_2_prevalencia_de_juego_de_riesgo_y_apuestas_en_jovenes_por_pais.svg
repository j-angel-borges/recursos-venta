  </g>
  <g id="labels">
  <g id="header">
    <circle cx="50" cy="60" r="4.5" fill="#6F58A7"/>
    <text x="64" y="65" class="badge-text">LATAM &amp; GLOBAL // PREVALENCIA CLÍNICA</text>
    <text x="50" y="103" class="chart-title">Prevalencia de Juego de Riesgo y Apuestas en Jóvenes por País</text>
