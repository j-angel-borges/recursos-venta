  </g>
  <g id="source">
  <g id="footer">
    <text x="50" y="1045" class="footer-text">Fuente: MINSA / MINCETUR Perú, OPS/OMS, Fiocruz Brasil, Coljuegos, DGOJ España, SAMHSA EE.UU. (145 fuentes)</text>
