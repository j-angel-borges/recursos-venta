  </g>
  <g id="axes"></g>
  <g id="series">
    <path d="M 675.7 225.4 A 369.6 369.6 0 0 1 1033.5 672.0 L 888.9 641.2 A 221.8 221.8 0 0 0 674.2 373.3 Z" fill="#6F58A7" stroke="#191B22" stroke-width="2.5"/>
    <path d="M 1031.9 679.2 A 369.6 369.6 0 0 1 617.8 960.6 L 639.5 814.4 A 221.8 221.8 0 0 0 887.9 645.5 Z" fill="#D6C8FA" stroke="#191B22" stroke-width="2.5"/>
    <path d="M 610.5 959.5 A 369.6 369.6 0 0 1 303.4 621.9 L 450.8 611.1 A 221.8 221.8 0 0 0 635.1 813.7 Z" fill="#C2F4E7" stroke="#191B22" stroke-width="2.5"/>
    <path d="M 302.9 614.5 A 369.6 369.6 0 0 1 424.8 320.2 L 523.7 430.1 A 221.8 221.8 0 0 0 450.5 606.7 Z" fill="#5A6271" stroke="#191B22" stroke-width="2.5"/>
    <path d="M 430.4 315.3 A 369.6 369.6 0 0 1 668.3 225.4 L 669.8 373.3 A 221.8 221.8 0 0 0 527.0 427.2 Z" fill="#00F2FE" stroke="#191B22" stroke-width="2.5"/>
    <circle cx="672.0" cy="595.0" r="218.8" fill="#202538"/>
    <text x="672.0" y="601.0" class="data-label" font-size="44px" text-anchor="middle">28.5%</text>
    <text x="672.0" y="627.0" class="axis-label" font-size="15px" text-anchor="middle">Hipofrontalidad Prefrontal</text>
  </g>
  <g id="labels">
    <rect x="1113.6" y="449.3" width="14" height="14" rx="3.5" fill="#6F58A7"/>
    <text x="1137.6" y="462.3" class="legend-text">Hipofrontalidad Prefrontal</text>
    <text x="1855.0" y="462.3" class="tick-label" font-weight="700" fill="#FFFFFF" text-anchor="end">28 (28.5%)</text>
    <rect x="1113.6" y="511.3" width="14" height="14" rx="3.5" fill="#D6C8FA"/>
    <text x="1137.6" y="524.3" class="legend-text">Desensibilización D2/D3</text>
    <text x="1855.0" y="524.3" class="tick-label" font-weight="700" fill="#FFFFFF" text-anchor="end">24 (24.0%)</text>
    <rect x="1113.6" y="573.3" width="14" height="14" rx="3.5" fill="#C2F4E7"/>
    <text x="1137.6" y="586.3" class="legend-text">Craving Refuerzo Variable</text>
    <text x="1855.0" y="586.3" class="tick-label" font-weight="700" fill="#FFFFFF" text-anchor="end">22 (21.5%)</text>
    <rect x="1113.6" y="635.3" width="14" height="14" rx="3.5" fill="#5A6271"/>
    <text x="1137.6" y="648.3" class="legend-text">Trastorno Videojuegos (IGD)</text>
    <text x="1855.0" y="648.3" class="tick-label" font-weight="700" fill="#FFFFFF" text-anchor="end">14 (14.5%)</text>
    <rect x="1113.6" y="697.3" width="14" height="14" rx="3.5" fill="#00F2FE"/>
    <text x="1137.6" y="710.3" class="legend-text">Deuda Cognitiva &amp; Depresión</text>
    <text x="1855.0" y="710.3" class="tick-label" font-weight="700" fill="#FFFFFF" text-anchor="end">12 (11.5%)</text>
  <g id="header">
    <circle cx="50" cy="60" r="4.5" fill="#6F58A7"/>
    <text x="64" y="65" class="badge-text">NEUROCIENCIAS // PATOLOGÍAS DIGITALES</text>
    <text x="50" y="103" class="chart-title">Distribución Clínica de Nuevas Neuropatologías Digitales</text>
    <text x="50" y="133" class="chart-subtitle">Desglose de diagnósticos emergentes asociados a refuerzo intermitente y apuestas (CIE-11 / DSM-5)</text>
  </g>
  </g>
  <g id="source">
  <g id="footer">
    <text x="50" y="1045" class="footer-text">Fuente: The Lancet Psychiatry, Nature Neuroscience, APA DSM-5-TR, CIE-11 OMS, INSM HD-HN Perú (150 fuentes)</text>
  </g>
  </g>
</svg>