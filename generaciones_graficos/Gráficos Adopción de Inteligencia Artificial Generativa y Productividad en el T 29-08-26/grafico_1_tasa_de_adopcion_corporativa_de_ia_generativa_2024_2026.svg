    <rect x="385.0" y="659.0" width="42.2" height="336.0" fill="#FE7E57" rx="4"/>
    <rect x="433.0" y="715.0" width="42.2" height="280.0" fill="#0AE88A" rx="4"/>
    <rect x="879.0" y="309.0" width="42.2" height="686.0" fill="#3D51F2" rx="4"/>
    <rect x="927.0" y="365.0" width="42.2" height="630.0" fill="#8E9BF7" rx="4"/>
    <rect x="975.0" y="520.8" width="42.2" height="474.2" fill="#FE7E57" rx="4"/>
    <rect x="1023.0" y="561.9" width="42.2" height="433.1" fill="#0AE88A" rx="4"/>
    <rect x="1469.0" y="220.6" width="42.2" height="774.4" fill="#3D51F2" rx="4"/>
    <rect x="1517.0" y="261.8" width="42.2" height="733.2" fill="#8E9BF7" rx="4"/>
    <rect x="1565.0" y="400.0" width="42.2" height="595.0" fill="#FE7E57" rx="4"/>
    <rect x="1613.0" y="435.0" width="42.2" height="560.0" fill="#0AE88A" rx="4"/>
  </g>
  <g id="labels">
  <g id="header">
    <circle cx="50" cy="51" r="4" fill="#00F2FE"/>
    <text x="62" y="55" class="badge-text">TRANSFORMACIÓN DIGITAL // ADOPCIÓN CORPORATIVA</text>
    <text x="50" y="85" class="chart-title">Tasa de Adopción Corporativa de IA Generativa (2024 - 2026)</text>
    <text x="50" y="108" class="chart-subtitle">Porcentaje de empresas con pilotos y soluciones GenAI en producción (%)</text>
  </g>
