<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap');

:root {
  --pz-canvas: #0A0F1D;
  --pz-surface: #131827;
  --pz-elevated: #202538;
  --pz-border: #2E3856;
  --pz-border-subtle: #23293F;
  --pz-grid: #23293F;
  --pz-text-primary: #FFFFFF;
  --pz-text-secondary: #E2E8F0;
  --pz-text-muted: #94A3B8;
  --pz-text-dimmed: #64748B;
  --pz-mint: #00F2FE;
  --pz-blue: #4FACFE;
  --pz-lilac: #10B981;
  --pz-sol: #F43F5E;
  --pz-orange: #FFBCF0;
  --pz-coral: #D6C4FF;
  --pz-cyan: #FFDA6D;
}

.canvas-bg { fill: #0A0F1D; }
.card-surface { fill: #131827; stroke: #2E3856; stroke-width: 1px; rx: 16px; }
.elevated-card { fill: #202538; stroke: #23293F; stroke-width: 1px; rx: 12px; }

.badge-text {
  font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 11px;
  font-weight: 700;
  fill: #00F2FE;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.chart-title {
  font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 24px;
  font-weight: 700;
  fill: #FFFFFF;
  letter-spacing: -0.01em;
}

.chart-subtitle {
  font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 13px;
  font-weight: 400;
  fill: #94A3B8;
}

.axis-label {
  font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 12px;
  font-weight: 500;
  fill: #E2E8F0;
}

.tick-label {
  font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 11px;
  font-weight: 500;
  fill: #94A3B8;
  font-feature-settings: "tnum" 1, "zero" 1;
}

.data-label {
  font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 12px;
  font-weight: 700;
  fill: #FFFFFF;
  font-feature-settings: "tnum" 1, "zero" 1;
}

.grid-line {
  stroke: #23293F;
  stroke-width: 1px;
  stroke-dasharray: 4 4;
}

.axis-line {
  stroke: #2E3856;
  stroke-width: 1.5px;
}

.legend-text {
  font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 12px;
  font-weight: 500;
  fill: #E2E8F0;
}

.footer-text {
  font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 11px;
  font-weight: 400;
  fill: #64748B;
}

.watermark {
  font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
  font-size: 10px;
  font-weight: 600;
  fill: #64748B;
  letter-spacing: 0.05em;
}
]]></style>
  <g id="background">
    <rect width="1920" height="1080" class="canvas-bg"/>
    <rect x="20" y="20" width="1880" height="1040" class="card-surface"/>
  </g>
