    <rect x="1476.0" y="65" width="12" height="12" rx="3" fill="#FE7E57"/>
    <text x="1494.0" y="76" class="legend-text">América Latina</text>
    <rect x="1624.0" y="65" width="12" height="12" rx="3" fill="#0AE88A"/>
    <text x="1642.0" y="76" class="legend-text">Perú (Sector Corporativo)</text>
  </g>
  <g id="source">
  <g id="footer">
    <text x="50" y="1045" class="footer-text">Fuente: Microsoft WTI, IDC Latin America, McKinsey State of AI, INEI Perú (120 fuentes)</text>
  </g>
  </g>
</svg>