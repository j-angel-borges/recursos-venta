<!DOCTYPE html>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {

  }
  .chart-container {
    width: 1920px;
    height: 1080px;
    display: block;
    position: relative;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
  }
  .chart-container svg {
    display: block;
    width: 1920px;
    height: 1080px;
  }
  .interactive-tooltip {
    position: absolute;
    pointer-events: none;
    background: #202538;
    color: #FFFFFF;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    border: 1px solid #2E3856;

    transition: opacity 150ms ease;
