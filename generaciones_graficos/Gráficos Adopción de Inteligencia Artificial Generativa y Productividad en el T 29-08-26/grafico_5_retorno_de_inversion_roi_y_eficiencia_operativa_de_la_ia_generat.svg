<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&amp;family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap');
.bg { fill: #0A0F1D; }
.card-bg { fill: #131827; stroke: #2E3856; stroke-width: 1.5px; rx: 24px; }
.hero-card { fill: #202538; stroke: #23293F; stroke-width: 1px; rx: 16px; }
.badge { font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #00F2FE; letter-spacing: 0.08em; }
.slide-title { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 38px; font-weight: 700; fill: #FFFFFF; letter-spacing: -0.02em; }
.slide-sub { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #94A3B8; }
.kpi-num { font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace; font-size: 42px; font-weight: 700; fill: #FFFFFF; font-feature-settings: "tnum" 1, "zero" 1; }
.kpi-lbl { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #E2E8F0; }
.takeaway-title { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #00F2FE; letter-spacing: 0.04em; }
.takeaway-body { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #E2E8F0; line-height: 1.5; }
.footer-text { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #64748B; }
]]></style>
