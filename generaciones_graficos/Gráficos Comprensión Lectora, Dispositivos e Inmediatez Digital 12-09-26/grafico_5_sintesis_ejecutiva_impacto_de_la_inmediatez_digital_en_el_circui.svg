<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600;700&amp;family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;display=swap');
.bg { fill: #0A0813; }
.card-bg { fill: #16112B; stroke: #3B2A68; stroke-width: 1.5px; rx: 24px; }
.hero-card { fill: #20183E; stroke: #241B44; stroke-width: 1px; rx: 16px; }
.badge { font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; fill: #C2F4E7; letter-spacing: 0.08em; }
.slide-title { font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 38px; font-weight: 700; fill: #FFFFFF; letter-spacing: -0.02em; }
.slide-sub { font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 18px; font-weight: 400; fill: #A1A7B8; }
.kpi-num { font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace; font-size: 42px; font-weight: 700; fill: #FFFFFF; font-feature-settings: "tnum" 1, "zero" 1; }
.kpi-lbl { font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #D6C8FA; }
.takeaway-title { font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #C2F4E7; letter-spacing: 0.04em; }
.takeaway-body { font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #D6C8FA; line-height: 1.5; }
.footer-text { font-family: 'Outfit', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #707688; }
]]></style>
<rect width="1920" height="1080" class="bg"/>
<rect x="40" y="40" width="1840" height="1000" class="card-bg"/>
<text x="90" y="100" class="badge">DECK EJECUTIVO // DEUDA COGNITIVA</text>
<text x="90" y="150" class="slide-title">Síntesis Ejecutiva: Impacto de la Inmediatez Digital en el Circuito Lector</text>
<text x="90" y="185" class="slide-sub">Diagnóstico transversal de la erosión lectora por pantallas y sobrecarga atencional (2018 - 2026)</text>
<g transform="translate(60, 200)">

  <g id="background">
    
    
  </g>
  <g id="grid">
    <line x1="95" y1="640.0" x2="1055" y2="640.0" class="grid-line"/>
    <line x1="95" y1="511.2" x2="1055" y2="511.2" class="grid-line"/>
    <line x1="95" y1="382.5" x2="1055" y2="382.5" class="grid-line"/>
    <line x1="95" y1="253.8" x2="1055" y2="253.8" class="grid-line"/>
    <line x1="95" y1="125.0" x2="1055" y2="125.0" class="grid-line"/>
  </g>
  <g id="axes">
    <text x="81" y="645.0" class="tick-label" text-anchor="end">40</text>
    <text x="81" y="516.2" class="tick-label" text-anchor="end">50</text>
    <text x="81" y="387.5" class="tick-label" text-anchor="end">60</text>
    <text x="81" y="258.8" class="tick-label" text-anchor="end">70</text>
    <text x="81" y="130.0" class="tick-label" text-anchor="end">80</text>
    <text x="191.0" y="662.0" class="axis-label" text-anchor="middle">2018</text>
    <text x="383.0" y="662.0" class="axis-label" text-anchor="middle">2020</text>
    <text x="575.0" y="662.0" class="axis-label" text-anchor="middle">2022</text>
    <text x="767.0" y="662.0" class="axis-label" text-anchor="middle">2024</text>
    <text x="959.0" y="662.0" class="axis-label" text-anchor="middle">2026</text>
    <line x1="95" y1="1155.0" x2="1055" y2="1155.0" class="axis-line"/>
  </g>
  <g id="series">
    <rect x="161.0" y="145.6" width="54.0" height="1009.4" fill="#00F2FE" rx="5"/>
    <rect x="353.0" y="265.3" width="54.0" height="889.7" fill="#00F2FE" rx="5"/>
    <rect x="545.0" y="399.2" width="54.0" height="755.8" fill="#00F2FE" rx="5"/>
    <rect x="737.0" y="520.3" width="54.0" height="634.7" fill="#00F2FE" rx="5"/>
    <rect x="929.0" y="616.8" width="54.0" height="538.2" fill="#00F2FE" rx="5"/>
  </g>
  <g id="labels">
  <g id="header">
    <circle cx="50" cy="50" r="4.5" fill="#C2F4E7"/>
    <text x="64" y="55" class="badge-text">DATA INTELLIGENCE // STATS</text>
    <text x="50" y="85" class="chart-title">Gráfico Estadístico</text>
  </g>
  </g>
  <g id="source">
  <g id="footer">
    <text x="50" y="705" class="footer-text">Fuente: Investigación y análisis estadístico</text>
  </g>
  </g>

</g>
<rect x="1240" y="220" width="580" height="125" class="hero-card"/>
<line x1="1240" y1="224" x2="1285" y2="224" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
<text x="1265" y="260" class="kpi-lbl">Índice de Retención 2026</text>
<text x="1265" y="308" class="kpi-num">41.8%</text>
<text x="1795" y="308" class="takeaway-title" fill="#FE7E57" text-anchor="end">-46.7% en 8 años</text>
<rect x="1240" y="370" width="580" height="570" class="hero-card"/>
<text x="1265" y="406" class="takeaway-title">HALLAZGOS CLAVE &amp; CONCLUSIONES</text>
<circle cx="1270" cy="435" r="3.5" fill="#C2F4E7"/>
<text x="1286" y="440" class="takeaway-body"><tspan x="1286" dy="0">Erosión progresiva de la memoria de trabajo</tspan><tspan x="1286" dy="20">ante la inmediatez algorítmica y feeds ultracortos.</tspan></text>
<circle cx="1270" cy="487" r="3.5" fill="#C2F4E7"/>
<text x="1286" y="492" class="takeaway-body"><tspan x="1286" dy="0">La lectura en pantalla genera una brecha</tspan><tspan x="1286" dy="20">crítica de -27.5 p.p. en comprensión analítica inferencial.</tspan></text>
<circle cx="1270" cy="539" r="3.5" fill="#C2F4E7"/>
<text x="1286" y="544" class="takeaway-body"><tspan x="1286" dy="0">En Perú, el 50.4% de escolares de 15 años se</tspan><tspan x="1286" dy="20">ubica por debajo del umbral mínimo lector PISA.</tspan></text>
<text x="90" y="1015" class="footer-text">Fuente: Delgado et al., OECD PISA, UNESCO, INEI Perú, Maryanne Wolf (140 fuentes)</text>
<text x="1830" y="1015" class="footer-text" text-anchor="end">DATA INTELLIGENCE // REPORTE EJECUTIVO</text>
</svg>